[project]
name = "dramatis-forge"
version = "0.2.0"
description = "Offline forge: turn a collaborative wiki into a retrieval-grounded character corpus"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28",
    "mwparserfromhell>=0.6.6",
    "typer>=0.15",
    "rich>=13.9",
    "tenacity>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Word segmentation for CJK text on the lexical path. Optional because the build falls
# back to a character-bigram segmenter that produces a usable (if weaker) FTS5 index; the
# choice is recorded in the folio manifest so the engine can tell which one it reads.
zh = ["jieba>=0.42"]
# Reference tokenizers for the `tokens.*` figures (context-budget sizing). Either backend
# works; the pack names which tokenizer to use.
tokens = ["tiktoken==0.12.0", "tokenizers==0.22.1"]

[project.scripts]
dramatis-forge = "dramatis_forge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dramatis_forge"]
