[workspace]
resolver = "3"
members = ["crates/folio", "crates/index", "bins/dramatis-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/alkalimc/dramatis"

[workspace.dependencies]
# One SQLite for the whole workspace. `bundled` so a user's platform SQLite — which may
# lack FTS5, or refuse to load extensions — cannot change retrieval behaviour. The corpus
# records which segmenter built its index; the reader must not also be a variable.
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
jieba-rs = "0.8"

[profile.release]
# The dense path is an exact full scan over ~59k vectors. LTO and a single codegen unit
# are what make that competitive with an approximate index, so they are not optional
# niceties here — P11 measures this profile.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
