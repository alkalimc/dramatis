[package]
name = "llm"
description = "One internal interface over the external LLM API protocols"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait.workspace = true
futures = "=0.3.34"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "=1.53.1", features = ["time"] }
# Platform TLS, like the rest of the workspace; only the byte transport lives here.
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2"] }
# Apple keychain only: the one supported platform. Elsewhere keyring falls back to its
# in-memory mock store, which keeps the workspace building on CI hosts.
keyring = { version = "=3.6.3", features = ["apple-native"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros", "time"] }

# Existence check by attributes only (no data read, no prompt); keyring has no such call.
# Same version keyring already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=2.11.1"
