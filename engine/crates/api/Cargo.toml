[package]
name = "api"
description = "The seam between the engine and the UI: commands, events, tool schemas, endpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Tauri glue: command handlers, typed events and the TypeScript exporter. Off by default
# so the rest of the workspace builds on hosts without a webview toolkit.
tauri = ["dep:tauri", "dep:tauri-specta", "dep:specta-typescript"]

[dependencies]
folio = { path = "../folio" }
index = { path = "../index" }
world = { path = "../world" }
async-trait.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
toml.workspace = true
tauri = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
# Local prompt overrides (`$DRAMATIS_HOME/prompts/<subject>.yaml`).
serde_norway = "=0.9.42"
sha2 = "=0.10.9"
# Hashed upload paths in avatar URLs (a path convention, not a security use).
md-5 = "=0.10.6"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
# `flock` for the per-save advisory lock (std's file locks need a newer toolchain).
libc = "=0.2.189"

[dev-dependencies]
folio = { path = "../folio", features = ["fixture"] }
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
