[package]
name = "dramatis"
description = "The desktop app: one process holding the window, the tray and the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "dramatis"
path = "src/main.rs"

[features]
# Embed `ui/dist` instead of loading the dev server. `tauri build` turns this on.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
api = { path = "../../crates/api", features = ["tauri"] }
runtime = { path = "../../crates/runtime" }
tauri = { workspace = true, features = ["tray-icon", "protocol-asset"] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-dialog = "=2.7.3"
tokio = { version = "=1.53.1", features = ["time"] }

# The notification plugin cannot set the banner's left-hand picture, so macOS calls the
# library under it directly; same version as the plugin's, from the lock file.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
# Draws a group's picture for a notification. The lock file has this version already,
# for tauri; PNG is the only format the cached pictures and the user's own are stored in,
# so no other codec is built.
image = { version = "=0.25.9", default-features = false, features = ["png"] }

[build-dependencies]
tauri-build.workspace = true
