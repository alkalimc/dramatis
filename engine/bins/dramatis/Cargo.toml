[package]
name = "dramatis"
description = "The desktop app: one process holding the window, the tray and the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dramatis"
path = "src/main.rs"

[features]
# Embed `ui/dist` instead of loading the dev server. `tauri build` turns this on.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
api = { path = "../../crates/api", features = ["tauri"] }
agent = { path = "../../crates/agent" }
folio = { path = "../../crates/folio" }
index = { path = "../../crates/index" }
world = { path = "../../crates/world" }
async-trait.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-notification = "=2.4.0"
tauri-plugin-dialog = "=2.7.3"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
toml.workspace = true
# The same keychain entries the agent reads: service `dramatis`, account `profile.<name>`.
keyring = { version = "=3.6.3", features = ["apple-native"] }

[dev-dependencies]
folio = { path = "../../crates/folio", features = ["fixture"] }

[build-dependencies]
tauri-build.workspace = true
