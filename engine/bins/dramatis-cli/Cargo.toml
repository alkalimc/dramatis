[package]
name = "dramatis-cli"
description = "Maintainer surface: inspect a corpus, query it, measure it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dramatis-cli"
path = "src/main.rs"

[dependencies]
folio = { path = "../../crates/folio" }
index = { path = "../../crates/index" }
eval = { path = "../../crates/eval" }
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
api = { path = "../../crates/api" }
agent = { path = "../../crates/agent" }
world = { path = "../../crates/world" }
llm = { path = "../../crates/llm" }
rusqlite.workspace = true
rustyline = { version = "=19.0.0", default-features = false }
toml.workspace = true
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }

[dev-dependencies]
folio = { path = "../../crates/folio", features = ["fixture"] }
async-trait.workspace = true
futures = "=0.3.34"
