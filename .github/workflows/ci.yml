name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          uv venv --python 3.13
          uv pip install -e '.[zh]' --group dev
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      # The desktop app links the system webview (webkit2gtk on Linux), and the only
      # supported platform is macOS: it is built and linted in the macOS jobs instead.
      - run: cargo clippy --workspace --exclude dramatis --all-targets -- -D warnings
      - run: cargo test --workspace --exclude dramatis

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Install forge
        working-directory: forge
        run: |
          uv venv --python 3.13
          uv pip install -e '.[zh]' --group dev
      # Builds the toy pack's folio, then runs both Rust contract tests against it with
      # DRAMATIS_REQUIRE_CONTRACT=1, so a missing folio fails instead of skipping.
      - name: Contract
        working-directory: forge
        run: make contract

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json   # version from `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm i --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo clippy -p dramatis --all-targets -- -D warnings
      - run: cargo build -p dramatis

  # The UI's types are generated from the api crate; a stale commit fails here.
  api-types:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Regenerate
        working-directory: engine
        run: cargo test -p dramatis --test bindings
      - run: git diff --exit-code ui/src/api.gen.ts
